name: Gerar Time-Lapse da Obra

on:
  # BotÃ£o "Run workflow" â€” gera um vÃ­deo sob demanda
  workflow_dispatch:
    inputs:
      pasta_obra:
        description: 'Pasta das fotos (nome ou ID do Drive)'
        required: true
        default: 'CONSÃ“RCIO AMAPÃ'
      data_inicio:
        description: 'Data inicial (AAAA-MM-DD)'
        required: true
        default: '2024-01-01'
      data_fim:
        description: 'Data final (AAAA-MM-DD) â€” vazio = hoje'
        required: false
        default: ''
      duracao:
        description: 'DuraÃ§Ã£o do vÃ­deo (minutos:segundos)'
        required: true
        default: '1:30'
      hora_inicial:
        description: 'Descartar fotos antes de'
        required: true
        default: '07:00'
      hora_final:
        description: 'Descartar fotos depois de'
        required: true
        default: '17:00'
      min_fotos_dia:
        description: 'MÃ­nimo de fotos para o dia entrar no vÃ­deo'
        required: true
        default: '3'
      resolucao:
        description: 'ResoluÃ§Ã£o'
        required: true
        default: '3840x2160'
        type: choice
        options:
          - '3840x2160'
          - '2560x1440'
          - '1920x1080'
      velocidade:
        description: 'Velocidade x qualidade da codificaÃ§Ã£o'
        required: true
        default: 'rapido'
        type: choice
        options:
          - 'rapido'
          - 'equilibrado'
          - 'qualidade'
      qualidade:
        description: 'CRF (14 = melhor, 28 = menor arquivo)'
        required: true
        default: '18'
      pasta_destino:
        description: 'Pasta onde salvar o vÃ­deo (nome ou ID)'
        required: false
        default: 'TimeLapse'

  # ExecuÃ§Ã£o automÃ¡tica: todo dia 1Âº Ã s 06:00 (MacapÃ¡ = UTC-3)
  schedule:
    - cron: '0 9 1 * *'

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Baixar o cÃ³digo
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependÃªncias
        run: pip install -q -r requirements.txt

      - name: Liberar espaÃ§o em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h / | tail -1

      - name: Gerar o vÃ­deo
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          # Nas execuÃ§Ãµes automÃ¡ticas os campos vÃªm vazios e os padrÃµes abaixo assumem
          PASTA_OBRA: ${{ inputs.pasta_obra || vars.PASTA_OBRA_PADRAO || 'CONSÃ“RCIO AMAPÃ' }}
          PASTA_DESTINO: ${{ inputs.pasta_destino || vars.PASTA_DESTINO_PADRAO || 'TimeLapse' }}
          DATA_INICIO: ${{ inputs.data_inicio || '2024-01-01' }}
          DATA_FIM: ${{ inputs.data_fim }}
          DURACAO: ${{ inputs.duracao || '1:30' }}
          HORA_INICIAL: ${{ inputs.hora_inicial || '07:00' }}
          HORA_FINAL: ${{ inputs.hora_final || '17:00' }}
          MIN_FOTOS_DIA: ${{ inputs.min_fotos_dia || '3' }}
          RESOLUCAO: ${{ inputs.resolucao || '3840x2160' }}
          VELOCIDADE: ${{ inputs.velocidade || 'rapido' }}
          QUALIDADE: ${{ inputs.qualidade || '18' }}
        run: python gerar_timelapse.py

      - name: Anexar o vÃ­deo Ã  execuÃ§Ã£o
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: timelapse
          path: video_final/*.mp4
          retention-days: 7
          if-no-files-found: warn
