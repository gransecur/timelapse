name: Gerar Time-Lapse da Obra

on:
  # Botao "Run workflow" - gera um video sob demanda
  workflow_dispatch:
    inputs:
      pasta_obra:
        description: 'Pasta das fotos (nome ou ID do Drive)'
        required: true
        default: 'CONSORCIO AMAPA'
      data_inicio:
        description: 'Data inicial (AAAA-MM-DD)'
        required: true
        default: '2024-01-01'
      data_fim:
        description: 'Data final (AAAA-MM-DD) - deixe vazio para hoje'
        required: false
        default: ''
      duracao:
        description: 'Duracao do video (minutos:segundos)'
        required: true
        default: '1:30'
      hora_inicial:
        description: 'Descartar fotos antes de'
        required: true
        default: '07:00'
      hora_final:
        description: 'Descartar fotos depois de'
        required: true
        default: '17:00'
      min_fotos_dia:
        description: 'Minimo de fotos para o dia entrar no video'
        required: true
        default: '3'
      resolucao:
        description: 'Resolucao'
        required: true
        default: '3840x2160'
        type: choice
        options:
          - '3840x2160'
          - '2560x1440'
          - '1920x1080'
      velocidade:
        description: 'Velocidade x qualidade da codificacao'
        required: true
        default: 'rapido'
        type: choice
        options:
          - 'rapido'
          - 'equilibrado'
          - 'qualidade'
      qualidade:
        description: 'CRF (14 = melhor qualidade, 28 = arquivo menor)'
        required: true
        default: '18'
      pasta_destino:
        description: 'Pasta onde salvar o video (nome ou ID)'
        required: false
        default: 'TimeLapse'
      salvar_no_drive:
        description: 'Tentar salvar tambem no Google Drive (so funciona com Workspace)'
        required: true
        default: 'nao'
        type: choice
        options:
          - 'nao'
          - 'sim'

  # Execucao automatica: todo dia 1 as 06:00 em Macapa (09:00 UTC)
  schedule:
    - cron: '0 9 1 * *'

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -q -r requirements.txt

      - name: Liberar espaco em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h / | tail -1

      - name: Gerar o video
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          PASTA_OBRA: ${{ inputs.pasta_obra || vars.PASTA_OBRA_PADRAO || 'CONSORCIO AMAPA' }}
          PASTA_DESTINO: ${{ inputs.pasta_destino || vars.PASTA_DESTINO_PADRAO || 'TimeLapse' }}
          DATA_INICIO: ${{ inputs.data_inicio || '2024-01-01' }}
          DATA_FIM: ${{ inputs.data_fim }}
          DURACAO: ${{ inputs.duracao || '1:30' }}
          HORA_INICIAL: ${{ inputs.hora_inicial || '07:00' }}
          HORA_FINAL: ${{ inputs.hora_final || '17:00' }}
          MIN_FOTOS_DIA: ${{ inputs.min_fotos_dia || '3' }}
          RESOLUCAO: ${{ inputs.resolucao || '3840x2160' }}
          VELOCIDADE: ${{ inputs.velocidade || 'rapido' }}
          QUALIDADE: ${{ inputs.qualidade || '18' }}
          SALVAR_NO_DRIVE: ${{ inputs.salvar_no_drive || 'nao' }}
          PYTHONIOENCODING: 'utf-8'
        run: python gerar_timelapse.py

      - name: Publicar o video para download
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="video-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "video_final/$NOME_VIDEO" \
            --title "$TITULO_RELEASE" \
            --notes-file video_final/NOTAS.md
          echo "LINK=$(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_ENV"

      - name: Mostrar o link
        if: success()
        run: |
          {
            echo "## Video pronto"
            echo ""
            echo "**$TITULO_RELEASE**"
            echo ""
            echo "[Abrir a pagina de download]($LINK)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar copia de seguranca
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: timelapse-recuperacao
          path: video_final/*.mp4
          retention-days: 2
          if-no-files-found: ignore
